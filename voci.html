<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Voci TTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }
    textarea {
      width: 100%;
      height: 110px;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 1.2rem;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .controls > div {
      flex: 1;
      min-width: 140px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    .value {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }
    button {
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-speak {
      background: #0ea5e9;
      color: white;
    }
    .btn-speak:hover { background: #0284c7; }
    .btn-stop {
      background: #ef4444;
      color: white;
    }
    .btn-stop:hover { background: #dc2626; }
    .btn-all {
      background: #8b5cf6;
      color: white;
    }
    .btn-all:hover { background: #7c3aed; }
    .status {
      margin: 1rem 0;
      padding: 0.6rem 1rem;
      background: #1e293b;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .status.speaking { color: #4ade80; }
    .voices-list {
      margin-top: 1.5rem;
    }
    .voices-list h2 {
      font-size: 1.15rem;
      margin-bottom: 0.8rem;
      color: #f1f5f9;
    }
    .voice-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid #334155;
    }
    .voice-item:hover {
      border-color: #475569;
    }
    .voice-info {
      flex: 1;
      min-width: 0;
    }
    .voice-name {
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .voice-meta {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .voice-item button {
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      background: #334155;
      color: #e2e8f0;
      flex-shrink: 0;
    }
    .voice-item button:hover {
      background: #475569;
    }
    .voice-item.default .voice-name::after {
      content: " · DEFAULT";
      color: #38bdf8;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .count {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0.8rem;
    }
    @media (max-width: 500px) {
      .controls { flex-direction: column; }
      .voice-item { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Voci TTS</h1>
    <p class="subtitle">Inserisci un testo e prova tutte le voci disponibili nel tuo browser</p>

    <label for="text">Testo da far leggere</label>
    <textarea id="text" placeholder="Scrivi qui il testo...">Ciao! Questa è una prova della sintesi vocale del browser. Come suona questa voce?</textarea>

    <div class="controls">
      <div>
        <label>Velocità</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        <div class="value">Valore: <span id="rateVal">1</span></div>
      </div>
      <div>
        <label>Tono (Pitch)</label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
        <div class="value">Valore: <span id="pitchVal">1</span></div>
      </div>
    </div>

    <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
      <button class="btn-speak" id="btnSpeak">▶ Parla (voce selezionata)</button>
      <button class="btn-stop" id="btnStop">⏹ Stop</button>
      <button class="btn-all" id="btnAll">🔊 Prova tutte le voci</button>
    </div>

    <div class="status" id="status">In attesa delle voci...</div>

    <div class="voices-list">
      <h2>Voci disponibili</h2>
      <div class="count" id="count"></div>
      <div id="voices"></div>
    </div>
  </div>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let selectedVoice = null;
    let isPlayingAll = false;

    const textEl = document.getElementById('text');
    const rateEl = document.getElementById('rate');
    const pitchEl = document.getElementById('pitch');
    const rateVal = document.getElementById('rateVal');
    const pitchVal = document.getElementById('pitchVal');
    const statusEl = document.getElementById('status');
    const voicesEl = document.getElementById('voices');
    const countEl = document.getElementById('count');

    rateEl.addEventListener('input', () => rateVal.textContent = rateEl.value);
    pitchEl.addEventListener('input', () => pitchVal.textContent = pitchEl.value);

    function loadVoices() {
      voices = synth.getVoices().sort((a, b) => {
        // Prima le voci italiane, poi le altre ordinate per lingua e nome
        const aIt = a.lang.startsWith('it') ? 0 : 1;
        const bIt = b.lang.startsWith('it') ? 0 : 1;
        if (aIt !== bIt) return aIt - bIt;
        return a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name);
      });

      if (voices.length === 0) {
        statusEl.textContent = 'Nessuna voce trovata. Prova a ricaricare la pagina.';
        return;
      }

      countEl.textContent = `${voices.length} voci trovate`;
      voicesEl.innerHTML = '';

      voices.forEach((voice, i) => {
        const div = document.createElement('div');
        div.className = 'voice-item' + (voice.default ? ' default' : '');
        div.innerHTML = `
          <div class="voice-info">
            <div class="voice-name">${voice.name}</div>
            <div class="voice-meta">${voice.lang}${voice.localService ? ' · locale' : ' · online'}</div>
          </div>
          <button data-index="${i}">Prova</button>
        `;
        voicesEl.appendChild(div);
      });

      // Seleziona di default la prima voce italiana o la default
      selectedVoice = voices.find(v => v.lang.startsWith('it')) || voices.find(v => v.default) || voices[0];
      statusEl.textContent = `Pronto · ${voices.length} voci caricate`;
    }

    // Carica le voci (necessario perché in Chrome arrivano in ritardo)
    loadVoices();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadVoices;
    }

    function speak(voice) {
      if (synth.speaking) synth.cancel();

      const text = textEl.value.trim();
      if (!text) {
        statusEl.textContent = 'Inserisci un testo prima di parlare.';
        return;
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = voice;
      utter.rate = parseFloat(rateEl.value);
      utter.pitch = parseFloat(pitchEl.value);
      utter.lang = voice.lang;

      utter.onstart = () => {
        statusEl.textContent = `Sta parlando: ${voice.name}`;
        statusEl.classList.add('speaking');
      };
      utter.onend = () => {
        statusEl.textContent = 'Finito.';
        statusEl.classList.remove('speaking');
      };
      utter.onerror = () => {
        statusEl.textContent = 'Errore durante la sintesi.';
        statusEl.classList.remove('speaking');
      };

      synth.speak(utter);
    }

    // Click su "Prova" di una singola voce
    voicesEl.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        const idx = parseInt(e.target.dataset.index, 10);
        selectedVoice = voices[idx];
        isPlayingAll = false;
        speak(selectedVoice);
      }
    });

    document.getElementById('btnSpeak').addEventListener('click', () => {
      isPlayingAll = false;
      if (selectedVoice) speak(selectedVoice);
      else statusEl.textContent = 'Nessuna voce selezionata.';
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      isPlayingAll = false;
      synth.cancel();
      statusEl.textContent = 'Fermato.';
      statusEl.classList.remove('speaking');
    });

    // Prova tutte le voci una dopo l'altra
    document.getElementById('btnAll').addEventListener('click', async () => {
      if (isPlayingAll) return;
      isPlayingAll = true;
      const text = textEl.value.trim() || 'Prova voce.';

      for (let i = 0; i < voices.length && isPlayingAll; i++) {
        const voice = voices[i];
        statusEl.textContent = `Prova ${i + 1}/${voices.length}: ${voice.name}`;
        statusEl.classList.add('speaking');

        await new Promise((resolve) => {
          const utter = new SpeechSynthesisUtterance(text);
          utter.voice = voice;
          utter.rate = parseFloat(rateEl.value);
          utter.pitch = parseFloat(pitchEl.value);
          utter.lang = voice.lang;
          utter.onend = resolve;
          utter.onerror = resolve;
          synth.speak(utter);
        });

        // Piccola pausa tra una voce e l'altra
        if (isPlayingAll) await new Promise(r => setTimeout(r, 400));
      }

      if (isPlayingAll) {
        statusEl.textContent = 'Tutte le voci sono state provate.';
        statusEl.classList.remove('speaking');
      }
      isPlayingAll = false;
    });
  </script>
</body>
</html>
